<app-wait-icon *ngIf="loading"></app-wait-icon>

         <img id="moldura" src="/assets/molduras/moldura01.png" alt=""> 
    </div>
  </div>
</div>
<div id="botao" class="position-absolute bottom-1 start-50 translate-middle-x">
    <button class="btn btn-primary" (click)="capturarFoto()"><i class="bi bi-camera"></i></button>
</div>
